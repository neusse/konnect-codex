[package]
name = "konnect-codex"
version = "0.1.4"
edition = "2021"
rust-version = "1.85"
authors = ["Konnect contributors"]
license = "AGPL-3.0-only"
description = "Reversible Codex companion installer for Konnect"
readme = "README.md"
repository = "https://github.com/neusse/konnect-codex"
homepage = "https://github.com/neusse/konnect-codex"
include = ["src/**", "template/**", "docs/assets/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
anyhow = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

# Keep the companion independently buildable and removable from the Konnect
# workspace. It can be split into its own repository without manifest changes.
[workspace]
