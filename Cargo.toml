[package]
name = "konnect-codex"
version = "0.6.1"
edition = "2021"
rust-version = "1.85"
authors = ["Konnect contributors"]
license = "AGPL-3.0-only"
description = "Installer and lifecycle manager for the Konnect Codex plugin"
readme = "README.md"
repository = "https://github.com/neusse/konnect-codex"
homepage = "https://github.com/neusse/konnect-codex"
include = [".codex/**", "src/**", "template/**", "docs/**", "policy/**", "build.rs", "compatibility.json", "Cargo.toml", "Cargo.lock", "README.md", "RELEASE_NOTES.md", "LICENSE"]

[dependencies]
anyhow = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

# Keep the plugin independently buildable and removable from the Konnect
# workspace. It can be split into its own repository without manifest changes.
[workspace]
